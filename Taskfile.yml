version: "3"

vars:
  SERVICE_BIN: "{{ .USER_WORKING_DIR }}/bin/services"
  GOLANGCI_LINT_VER: v2.10.1

env:
  GOBIN: "{{ .USER_WORKING_DIR }}/bin/utils"
  CGO_ENABLED: 0

tasks:
  install:tools:
    cmds:
      - curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b {{ .GOBIN }} {{ .GOLANGCI_LINT_VER }}
      # На данный момент не работает корректно
      # go get -u -tool github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{ .GOLANGCI_LINT_VER }}

  install:server:
    cmd: go mod download

  install:front:
    dir: frontend
    cmd: npm install

  go:lint:
    cmd: "{{ .GOBIN }}/golangci-lint run --max-issues-per-linter 0 --max-same-issues 0"

  go:lint:fix:
    cmd: "{{ .GOBIN }}/golangci-lint run --fix --max-issues-per-linter 0 --max-same-issues 0"

  go:format:
    cmds:
      - go tool gofumpt -l -w .
      - go tool goimports -l -w .
      - go tool gci write -s standard -s default -s "localmodule" --skip-generated .

  go:deadcode:
    cmd: go tool deadcode -test ./...

  go:generate:
    cmds:
      - go tool ogen --target openapi/agentapi -package agentapi --clean openapi/agent.yaml
      - ggo tool ogen --target openapi/serverapi -package serverapi --clean openapi/server.yaml

  go:generate:config:
    cmds:
      - "go build -trimpath -o {{ .SERVICE_BIN }}/configremaper  ./cmd/configremaper"
      - "{{ .SERVICE_BIN }}/configremaper --out config-generated.yaml"
      - "{{ .SERVICE_BIN }}/configremaper --out config-generated.env"
      - "{{ .SERVICE_BIN }}/configremaper --out config-generated.toml"

  go:generate:grafana:
    cmds:
      - "go build -trimpath -o {{ .SERVICE_BIN }}/grafanagenerator  ./cmd/grafanagenerator"
      - "{{ .SERVICE_BIN }}/grafanagenerator  --config config-dashboard.toml"

  go:tidy:
    cmd: go mod tidy

  run:server:
    cmds:
      - "go build -trimpath -o {{ .SERVICE_BIN }}/server  ./cmd/server"
      - "{{ .SERVICE_BIN }}/server --config config.toml"

  run:server:example:
    cmds:
      - "go build -trimpath -o {{ .SERVICE_BIN }}/server  ./cmd/server"
      - "{{ .SERVICE_BIN }}/server --config config-example.toml"

  build:server:
    cmds:
      - CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o {{ .SERVICE_BIN }}/server-linux-arm64  ./cmd/server
      - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o {{ .SERVICE_BIN }}/server-linux-amd64  ./cmd/server
      - CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -o {{ .SERVICE_BIN }}/server-windows-amd64.exe  ./cmd/server

  doc:db:
    cmd: |
      tbls doc \
        -t mermaid \
        --force \
        postgres://hgrabernextuser:hgrabernextpass@localhost:5432/hgrabernext?sslmode=disable \
        docs/database

  doc:arch:
    cmd: go tool goarchlint generate

  run:front:
    dir: frontend
    cmd: npm run dev

  build:front:
    dir: frontend
    cmd: npm run build

  build:docker:
    cmds:
      - docker build -f Dockerfile -t hgraber-next:latest .

  ts:format:
    dir: frontend
    cmd: npx prettier --write -l ./src
